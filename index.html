<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f7fb"><title>Kos Digital</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1b2635;--muted:#718096;--line:#e6eaf0;--blue:#3157d5;--pale:#edf1ff;--green:#16845b;--red:#c24141;--amber:#a66b12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hide{display:none!important}.wrap{max-width:1120px;margin:auto;padding:22px}.top,.row,.section{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:19px}.logo{width:42px;height:42px;border-radius:13px;background:var(--blue);color:white;display:grid;place-items:center}.muted{color:var(--muted)}.small{font-size:12px}.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--blue);color:white;font-weight:700}.ghost{background:white;color:var(--ink);border:1px solid var(--line)}.pale{background:var(--pale);color:var(--blue)}.danger{background:#fff0f0;color:var(--red)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 8px 25px #18243a0a}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,1fr)}.cols{grid-template-columns:1.2fr 1fr}.stat strong{display:block;font-size:25px;margin-top:5px}.section{margin:22px 0 12px}.section h2,.card h2,.card h3{margin:0 0 10px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.tab{padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--muted)}.tab.on{background:var(--pale);color:var(--blue);border-color:#d8e1ff;font-weight:700}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:650}.field input,.field textarea,.field select{border:1px solid #d9dfe8;border-radius:10px;padding:11px;background:white;width:100%}.field textarea{min-height:95px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.table{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted)}.pill{border-radius:30px;padding:4px 9px;font-size:12px;font-weight:700;background:#f1f3f6}.paid,.selesai{background:#e6f6ed;color:var(--green)}.pending,.menunggu{background:#fff4dd;color:var(--amber)}.failed,.expired{background:#ffeded;color:var(--red)}.login{max-width:430px;margin:8vh auto;padding:0 16px}.login .card{padding:25px}.login h1{margin:4px 0}.notice{background:#f0f4ff;color:#4058a5;padding:12px;border-radius:10px;font-size:13px;margin:12px 0}.error{color:var(--red);font-size:13px}.empty{text-align:center;padding:24px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.modalbg{position:fixed;inset:0;background:#0c173366;display:grid;place-items:center;padding:15px}.modal{background:white;border-radius:16px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto}@media(max-width:720px){.wrap{padding:14px}.stats{grid-template-columns:1fr 1fr}.cols,.two{grid-template-columns:1fr}.top{align-items:flex-start}.card{padding:15px}.stat strong{font-size:22px}}
</style></head><body>
<div id="login" class="login"><div class="brand"><div class="logo">⌂</div><div><div id="publicName">Kos Digital</div><div class="muted small">Portal pengelolaan kos</div></div></div><div class="card"><div class="muted small">SELAMAT DATANG</div><h1>Masuk ke akun kos</h1><p class="muted">Pilih jenis akun untuk melanjutkan.</p><div class="tabs"><button class="tab on" data-role="tenant">Penyewa</button><button class="tab" data-role="admin">Admin pemilik</button></div><form id="loginForm"><input type="hidden" id="role" value="tenant"><div class="field"><label>Username</label><input id="username" required autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><p id="loginError" class="error"></p><button class="btn" style="width:100%">Masuk</button></form><div class="notice">Akun penyewa dibuat oleh admin. Hubungi pemilik kos jika belum memiliki akun.</div></div></div>
<div id="app" class="hide"><div class="wrap"><header class="top"><div class="brand"><div class="logo">⌂</div><div><div id="name">Kos Digital</div><div class="muted small">Dashboard kos</div></div></div><div class="actions"><span id="who" class="muted small"></span><button id="logout" class="btn ghost">Keluar</button></div></header><div id="force" class="card hide"><h2>Ganti password sementara</h2><form id="passForm"><div class="field"><label>Password saat ini</label><input id="oldPass" type="password" required></div><div class="field"><label>Password baru (min. 10 karakter)</label><input id="newPass" type="password" minlength="10" required></div><button class="btn">Simpan</button></form><p id="passMsg" class="error"></p></div><nav id="nav" class="tabs"></nav><main id="content"></main></div></div><div id="modal"></div><div id="toast" style="display:none;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1b2635;color:white;padding:10px 16px;border-radius:10px"></div>
<script>
const $=s=>document.querySelector(s);let me=null,role='tenant',tab='dashboard',dash=null,pub={};const money=n=>'Rp '+Number(n||0).toLocaleString('id-ID'),date=d=>d?new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,o={}){let r=await fetch('/api/'+p,{...o,credentials:'same-origin',headers:{'Content-Type':'application/json',...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Permintaan gagal');return d}
function toast(s){let e=$('#toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
function pill(s){let n={paid:'Lunas',pending:'Menunggu',unpaid:'Belum lunas',failed:'Gagal',expired:'Kedaluwarsa',menunggu:'Menunggu',diproses:'Diproses',selesai:'Selesai'};return '<span class="pill '+esc(s)+'">'+(n[s]||esc(s))+'</span>'}
function loginView(){$('#app').classList.add('hide');$('#login').classList.remove('hide')}
async function boot(){try{pub=await api('public');$('#publicName').textContent=pub.settings.boarding_name||'Kos Digital';let d=await api('me');me=d.user;role=me.role;$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#name').textContent=pub.settings.boarding_name||'Kos Digital';$('#who').textContent=me.name||me.username;$('#force').classList.toggle('hide',!me.must_change_password);nav();await load()}catch(e){loginView()}}
function nav(){let items=role==='admin'?[['dashboard','Ringkasan'],['tenants','Penyewa'],['rooms','Kamar'],['payments','Pembayaran'],['complaints','Keluhan'],['settings','Pengaturan']]:[['dashboard','Beranda'],['payments','Pembayaran'],['renew','Perpanjang'],['complaints','Keluhan']];$('#nav').innerHTML=items.map(x=>'<button class="tab '+(tab===x[0]?'on':'')+'" data-tab="'+x[0]+'">'+x[1]+'</button>').join('');$('#nav').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;nav();load()})}
function go(t){tab=t;nav();load()}
async function load(){try{if(tab==='dashboard'){dash=await api('dashboard');dashboard()}if(tab==='tenants'){let d=await api('tenants');tenants(d.tenants)}if(tab==='rooms'){let d=await api('rooms');rooms(d.rooms)}if(tab==='payments'){let d=await api('payments');payments(d.payments)}if(tab==='complaints'){let d=await api('complaints');complaints(d.complaints)}if(tab==='settings')settings();if(tab==='renew')renew()}catch(e){$('#content').innerHTML='<div class="card error">'+esc(e.message)+'</div>'}}
function stat(a,b,c){return '<div class="card stat"><div class="muted">'+a+'</div><strong>'+b+'</strong><div class="muted small">'+(c||'')+'</div></div>'}
function dashboard(){if(role==='admin'){let d=dash;$('#content').innerHTML='<div class="section"><div><h2>Halo, '+esc(me.name||'Admin')+' 👋</h2><div class="muted">Ringkasan kondisi kos hari ini.</div></div></div><div class="grid stats">'+stat('Penyewa aktif',d.tenants.active,'dari '+d.tenants.total+' akun')+stat('Kamar kosong',d.rooms.vacant,'total '+d.rooms.total+' kamar')+stat('Pendapatan bulan ini',money(d.payments.revenue),d.payments.paid+' pembayaran lunas')+stat('Keluhan terbuka',d.openComplaints,'Perlu ditindaklanjuti')+'</div><div class="grid cols" style="margin-top:15px"><div class="card"><h3>Pembayaran</h3><p>Belum lunas: <b>'+d.payments.unpaid+'</b></p><button class="btn pale" onclick="go(\\'payments\\')">Lihat pembayaran</button></div><div class="card"><h3>Pengaturan kos</h3><p class="muted">Atur tarif, kamar, akun penyewa dan informasi kos.</p><button class="btn" onclick="go(\\'settings\\')">Atur kos</button></div></div>'}else{let t=dash.tenant||{};$('#content').innerHTML='<div class="section"><div><h2>Halo, '+esc(t.full_name||me.name)+' 👋</h2><div class="muted">Selamat datang di portal penyewa.</div></div></div><div class="grid stats">'+stat('Nomor kamar',esc(t.room_number||'—'),'Kamar kamu')+stat('Sewa per bulan',money(t.monthly_rent),'Tarif saat ini')+stat('Kontrak berakhir',date(t.contract_end),'Tanggal akhir sewa')+stat('Status akun',t.is_active?'Aktif':'Nonaktif','Status penyewa')+'</div><div class="grid cols" style="margin-top:15px"><div class="card"><h3>Kontrak sewa</h3><p>Mulai: <b>'+date(t.contract_start)+'</b></p><p>Berakhir: <b>'+date(t.contract_end)+'</b></p><button class="btn" onclick="go(\\'renew\\')">Perpanjang kontrak</button></div><div class="card"><h3>Butuh bantuan?</h3><p class="muted">Kirim keluhan kepada pemilik kos.</p><button class="btn pale" onclick="go(\\'complaints\\')">Kirim keluhan</button></div></div><div class="section"><h3>Pembayaran terbaru</h3></div>'+paymentTable(dash.payments||[])}}
function paymentTable(rows){return '<div class="card table"><table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Periode</th><th>Jumlah</th><th>Status</th></tr></thead><tbody>'+(rows.length?rows.map(p=>'<tr><td>'+date(String(p.created_at).slice(0,10))+'</td><td>'+(p.payment_type==='initial'?'Sewa awal':'Perpanjangan')+'</td><td>'+date(p.period_start)+' - '+date(p.period_end)+'</td><td>'+money(p.amount)+'</td><td>'+pill(p.status)+'</td></tr>').join(''):'<tr><td colspan="5" class="empty">Belum ada pembayaran.</td></tr>')+'</tbody></table></div>'}
function payments(rows){$('#content').innerHTML='<div class="section"><h2>Catatan pembayaran</h2></div>'+paymentTable(rows);if(role==='admin')$('#content').querySelectorAll('tbody tr').forEach((tr,i)=>{let p=rows[i];if(p&&p.status!=='paid')tr.lastElementChild.innerHTML+=' <button class="btn pale" onclick="markPaid('+p.id+')">Tandai lunas</button>'})}
async function markPaid(id){if(!confirm('Pastikan dana sudah diterima. Tandai lunas?'))return;try{await api('payments/'+id+'/mark-paid',{method:'POST',body:'{}'});toast('Pembayaran diperbarui');load()}catch(e){toast(e.message)}}
function tenants(rows){$('#content').innerHTML='<div class="section"><h2>Data penyewa</h2><button class="btn" onclick="tenantModal()">+ Tambah penyewa</button></div><div class="card table"><table><thead><tr><th>Nama</th><th>Username</th><th>Kamar</th><th>Tarif/bulan</th><th>Kontrak akhir</th><th>Status</th></tr></thead><tbody>'+(rows.length?rows.map(t=>'<tr><td>'+esc(t.full_name)+'</td><td>'+esc(t.username)+'</td><td>'+esc(t.room_number||'—')+'</td><td>'+money(t.monthly_rent)+'</td><td>'+date(t.contract_end)+'</td><td>'+pill(t.is_active?'paid':'failed')+' <button class="btn pale" onclick="toggleTenant('+t.id+','+(!t.is_active)+')">'+(t.is_active?'Nonaktifkan':'Aktifkan')+'</button></td></tr>').join(''):'<tr><td colspan="6" class="empty">Belum ada penyewa.</td></tr>')+'</tbody></table></div>'}
async function toggleTenant(id,is_active){try{await api('tenants/'+id,{method:'PATCH',body:JSON.stringify({is_active})});load()}catch(e){toast(e.message)}}
function modal(s){$('#modal').innerHTML='<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal">'+s+'</div></div>'}function closeModal(){$('#modal').innerHTML=''}
function tenantModal(){modal('<h2>Tambah penyewa</h2><form id="tenantForm"><div class="field"><label>Nama lengkap</label><input name="full_name" required></div><div class="two"><div class="field"><label>Username</label><input name="username" required></div><div class="field"><label>Password awal (min. 10 karakter)</label><input name="password" minlength="10" required></div></div><div class="two"><div class="field"><label>WhatsApp</label><input name="phone"></div><div class="field"><label>Tarif per bulan (Rp)</label><input name="monthly_rent" type="number" min="0" required></div></div><div class="field"><label>ID kamar (opsional)</label><input name="room_id" type="number"></div><button class="btn">Simpan penyewa</button></form>');$('#tenantForm').onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.room_id=o.room_id?Number(o.room_id):null;try{await api('tenants',{method:'POST',body:JSON.stringify(o)});closeModal();load();toast('Akun penyewa dibuat')}catch(x){toast(x.message)}}}
function rooms(rows){$('#content').innerHTML='<div class="section"><h2>Daftar kamar</h2><button class="btn" onclick="roomModal()">+ Tambah kamar</button></div><div class="grid stats">'+(rows.map(r=>'<div class="card"><div class="row"><b>Kamar '+esc(r.room_number)+'</b>'+pill(r.tenant_id?'paid':'unpaid')+'</div><h2>'+money(r.monthly_price)+'</h2><div class="muted small">'+esc(r.tenant_name||'Kosong')+'</div><button class="btn danger" onclick="deleteRoom('+r.id+')">Hapus</button></div>').join('')||'<div class="card empty">Belum ada kamar.</div>')+'</div>'}
function roomModal(){modal('<h2>Tambah kamar</h2><form id="roomForm"><div class="field"><label>Nomor kamar</label><input name="room_number" required></div><div class="field"><label>Harga khusus (opsional)</label><input name="monthly_price" type="number" min="0"></div><div class="field"><label>Catatan</label><input name="notes"></div><button class="btn">Simpan</button></form>');$('#roomForm').onsubmit=async e=>{e.preventDefault();try{await api('rooms',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});closeModal();load()}catch(x){toast(x.message)}}}
async function deleteRoom(id){if(!confirm('Hapus kamar?'))return;try{await api('rooms/'+id,{method:'DELETE'});load()}catch(e){toast(e.message)}}
function settings(){let s=dash?.settings||pub.settings||{};$('#content').innerHTML='<div class="card"><h2>Pengaturan kos</h2><form id="settingsForm"><div class="field"><label>Nama kos</label><input name="boarding_name" value="'+esc(s.boarding_name||'Kos Digital')+'" required></div><div class="field"><label>Alamat</label><textarea name="address">'+esc(s.address||'')+'</textarea></div><div class="two"><div class="field"><label>Harga perpanjangan/bulan (Rp)</label><input name="monthly_price" type="number" min="0" value="'+Number(s.monthly_price||0)+'" required></div><div class="field"><label>Harga sewa awal (Rp)</label><input name="initial_price" type="number" min="0" value="'+Number(s.initial_price||0)+'" required></div></div><button class="btn">Simpan pengaturan</button></form><p class="muted small">Harga baru berlaku untuk transaksi berikutnya.</p></div>';$('#settingsForm').onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.monthly_price=Number(o.monthly_price);o.initial_price=Number(o.initial_price);try{await api('settings',{method:'PUT',body:JSON.stringify(o)});pub.settings=o;toast('Pengaturan disimpan');load()}catch(x){toast(x.message)}}}
function complaints(rows){$('#content').innerHTML='<div class="section"><h2>'+(role==='admin'?'Keluhan penyewa':'Keluhan saya')+'</h2>'+(role==='tenant'?'<button class="btn" onclick="complaintModal()">+ Buat keluhan</button>':'')+'</div><div class="grid">'+(rows.map(c=>'<div class="card"><div class="row"><b>'+esc(c.title)+'</b>'+pill(c.status)+'</div>'+(role==='admin'?'<div class="muted small">'+esc(c.full_name)+' · kamar '+esc(c.room_number||'—')+'</div>':'')+'<p>'+esc(c.description)+'</p>'+(c.admin_note?'<div class="notice">Catatan admin: '+esc(c.admin_note)+'</div>':'')+'<div class="row"><span class="muted small">'+date(String(c.created_at).slice(0,10))+'</span>'+(role==='admin'?'<button class="btn pale" onclick="complaintUpdate('+c.id+',\\''+c.status+'\\')">Tindak lanjuti</button>':'')+'</div></div>').join('')||'<div class="card empty">Belum ada keluhan.</div>')+'</div>'}
function complaintModal(){modal('<h2>Kirim keluhan</h2><form id="complaintForm"><div class="field"><label>Judul</label><input name="title" required maxlength="120"></div><div class="field"><label>Detail</label><textarea name="description" required minlength="5"></textarea></div><button class="btn">Kirim keluhan</button></form>');$('#complaintForm').onsubmit=async e=>{e.preventDefault();try{await api('complaints',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});closeModal();load();toast('Keluhan terkirim')}catch(x){toast(x.message)}}}
function complaintUpdate(id,status){modal('<h2>Tindak lanjuti keluhan</h2><form id="cu"><div class="field"><label>Status</label><select name="status"><option value="menunggu">Menunggu</option><option value="diproses">Diproses</option><option value="selesai">Selesai</option></select></div><div class="field"><label>Catatan admin</label><textarea name="admin_note"></textarea></div><button class="btn">Simpan</button></form>');$('#cu').elements.status.value=status;$('#cu').onsubmit=async e=>{e.preventDefault();try{await api('complaints/'+id,{method:'PATCH',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});closeModal();load()}catch(x){toast(x.message)}}}
function renew(){let t=dash?.tenant||{};$('#content').innerHTML='<div class="card" style="max-width:620px"><h2>Perpanjang kontrak</h2><p class="muted">Pilih durasi perpanjangan. Pembayaran QRIS akan muncul setelah pemilik mengaktifkan Midtrans.</p><div class="notice">Kontrak berakhir: <b>'+date(t.contract_end)+'</b><br>Tarif per bulan: <b>'+money(t.monthly_rent)+'</b></div><form id="renewForm"><div class="field"><label>Durasi</label><select name="months">'+Array.from({length:12},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+' bulan</option>').join('')+'</select></div><button class="btn">Buat pembayaran</button></form><p id="renewMsg" class="muted small"></p></div>';$('#renewForm').onsubmit=async e=>{e.preventDefault();try{let d=await api('renewals',{method:'POST',body:JSON.stringify({months:Number(new FormData(e.target).get('months'))})});if(d.redirectUrl){$('#renewMsg').innerHTML='Transaksi dibuat. <a target="_blank" rel="noopener" href="'+esc(d.redirectUrl)+'">Lanjutkan pembayaran</a>';location.href=d.redirectUrl}else $('#renewMsg').textContent='Transaksi dibuat.'}catch(x){$('#renewMsg').textContent=x.message}}}
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-role]').forEach(x=>x.classList.toggle('on',x===b));$('#role').value=b.dataset.role});
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';try{await api('login',{method:'POST',body:JSON.stringify({role:$('#role').value,username:$('#username').value,password:$('#password').value})});await boot()}catch(x){$('#loginError').textContent=x.message}};
$('#logout').onclick=async()=>{await api('logout',{method:'POST',body:'{}'});loginView()};
$('#passForm').onsubmit=async e=>{e.preventDefault();try{await api('change-password',{method:'POST',body:JSON.stringify({currentPassword:$('#oldPass').value,newPassword:$('#newPass').value})});$('#force').classList.add('hide');toast('Password diganti')}catch(x){$('#passMsg').textContent=x.message}};
boot();
</script></body></html>
