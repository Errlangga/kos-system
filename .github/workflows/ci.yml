name: Kos Digital CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check 'api/[...route].js'
      - name: Check browser JavaScript syntax
        run: node -e 'const fs=require("node:fs");const h=fs.readFileSync("index.html","utf8");const s=h.split("<script>")[1].split("</script>")[0];new Function(s);'
      - run: npm test
